name: Build
on: 
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.4
      
      - name: GO Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1

      - name: Run Build
        run: make build

      - name: Run Tests
        run: make test
