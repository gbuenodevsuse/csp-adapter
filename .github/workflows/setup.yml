name: Setup

on:
  workflow_call:

env:
  GO_VERSION: "1.25.4"

jobs:
  setup-go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GO
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify Go
        run: go version
