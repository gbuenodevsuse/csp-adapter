name: Setup GO

runs:
  using: composite
  steps:
    - name: Get GO Version
      id: go-version
      shell: bash
      run: |
        GO_VERSION=$(grep -E '^go[[:space:]]+[0-9]+' go.mod | awk '{print $2}')
        echo "GO=$GO_VERSION" >> $GITHUB_OUTPUT

    - name: Setup GO  
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
      with:
        go-version: ${{ steps.go-version.outputs.GO }}
